<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregnancy Risk Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>Fill Your Details</h2>
    <form id="riskForm">
      <label>
        Age:
        <input type="number" id="age" required />
      </label>
      <label>
        BMI:
        <input type="number" id="bmi" required />
      </label>
      <label>
        Blood Pressure (Systolic):
        <input type="number" id="bloodPressureSystolic" required />
      </label>
      <label>
        Blood Pressure (Diastolic):
        <input type="number" id="bloodPressureDiastolic" required />
      </label>
      <label>
        Blood Sugar:
        <input type="number" id="bloodSugar" required />
      </label>
      <label>
        Hemoglobin:
        <input type="number" id="hemoglobin" required />
      </label>
      <label>
        Protein in Urine:
        <select id="proteinInUrine" required>
          <option value="Negative">Negative</option>
          <option value="Positive">Positive</option>
        </select>
      </label>
      <label>
        Hydration Level:
        <select id="hydrationLevel" required>
          <option value="Normal">Normal</option>
          <option value="Low">Low</option>
        </select>
      </label>
      <label>
        Diet Quality:
        <select id="dietQuality" required>
          <option value="Good">Good</option>
          <option value="Poor">Poor</option>
        </select>
      </label>
      <label>
        History of Disease:
        <select id="historyOfDisease" required>
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </label>
      <label>
        Iron Intake:
        <input type="number" id="ironIntake" required />
      </label>
      <label>
        Hormone Levels:
        <input type="number" id="hormoneLevels" required />
      </label>
      <label>
        Number of Pregnancies:
        <input type="number" id="numberOfPregnancies" required />
      </label>
      <label>
        Nausea Intensity:
        <select id="nauseaIntensity" required>
          <option value="Mild">Mild</option>
          <option value="Severe">Severe</option>
        </select>
      </label>
      <label>
        Presence of Pain:
        <select id="presenceOfPain" required>
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </label>
      <label>
        Fetal Weight (grams):
        <input type="number" id="fetalWeight" required />
      </label>
      <label>
        Amniotic Fluid Index:
        <input type="number" id="amnioticFluidIndex" required />
      </label>
      <label>
        Smoking Status:
        <select id="smokingStatus" required>
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </label>
      <button type="submit">Submit</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
